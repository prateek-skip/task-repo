spring:
  application:
    name: product-catalog-service

  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
    hikari:
      # Small pool on purpose: reads are mostly served from cache, and a few
      # connections doing short indexed queries beat many connections queueing.
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Keeps the persistence context inside the transaction so controllers can
    # never trigger lazy loads and leak N+1 queries.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${CATALOG_REDIS_HOST:localhost}
      port: ${CATALOG_REDIS_PORT:6379}
      timeout: 500ms

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # PostgreSQL only. The service keeps serving from the database when Redis is down, so a
          # Redis outage must not take every instance out of the load balancer at once.
          include: readinessState,db

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

catalog:
  http:
    # Cache-Control max-age on product and listing responses.
    max-age: 30s
  cache:
    # Single products are evicted on write, so a long TTL is safe.
    product-ttl: 10m
    # Lists are invalidated by a generation counter; the short TTL only bounds
    # staleness if an eviction is ever missed.
    search-ttl: 60s
    # Categories are seeded reference data.
    category-ttl: 1h

---
spring:
  config:
    activate:
      on-profile: prod

# One JSON object per log line, so the log pipeline can index fields without parsing text.
logging:
  structured:
    format:
      console: ecs
